[project]
name = "testprj"
version = "0.1.0"
description = "Multi-agent system with RAG capabilities using Llama 3.2 and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Existing dependencies
    "agentops>=0.4.16",
    "chainlit>=2.5.5",
    "openai-agents>=0.2.6",
    "python-dotenv>=1.1.0",
    
    # RAG System Dependencies
    "chromadb>=0.4.15",
    "sentence-transformers>=2.2.2",
    "PyPDF2>=3.0.1",
    "python-docx>=0.8.11",
    "langchain>=0.1.0",
    
    # ML/AI Dependencies for embeddings
    "torch>=1.9.0",
    "transformers>=4.21.0",
    "scikit-learn>=1.0.2",
    "scipy>=1.7.3",
    "numpy>=1.21.0",
    
    # Additional document processing (optional)
    "pypdf>=3.0.0",
    "pdfplumber>=0.9.0",
    
    # Core Python libraries
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
testprj = "testprj:main"
llm = "testprj.simpleAgent:runAgent"
tool = "testprj.toolCalling:testAsync"
rag = "testprj.RAG_system.rag_system:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true